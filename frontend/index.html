<!DOCTYPE html>
<html>
<head>
  <title>Micro Subscription DApp</title>
</head>
<body>
  <h1>Micro Subscription Contract</h1>

  <!-- Connect Wallet -->
  <button id="connect">Connect Wallet</button>
  <p id="wallet"></p>

  <!-- Start Subscription -->
  <h3>Start Subscription</h3>
  <input id="rate" type="number" placeholder="Rate per sec">
  <button id="start">Start</button>

  <!-- Deposit -->
  <h3>Deposit</h3>
  <input id="amount" type="number" placeholder="Amount">
  <button id="deposit">Deposit</button>

  <!-- Get Balance -->
  <h3>Get Balance</h3>
  <button id="balance">Check Balance</button>
  <p id="balanceResult"></p>

  <!-- Stop Subscription -->
  <h3>Stop Subscription</h3>
  <button id="stop">Stop</button>

  <script src="app.js"></script>
</body>
</html>
